<!DOCTYPE html>
<!-- base.html -->
<html>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<head>
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
      <nav class="navbar navbar-expand-lg auth-navbar">
            <div class="container-fluid">
        
                <div class="navbar-content w-100 d-flex align-items-center">
        
                    <!-- Brand -->
                    <a class="navbar-brand auth-navbar-brand" href="{{ url_for('frontend.home') }}">
                        <span>Matchday</span>
                    </a>
        
                    <!-- Navigation links -->
                    <ul class="navbar-nav navbar-links mb-0 ms-auto">
        
                        {% if not current_user.is_authenticated %}
        
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('auth.login') }}">
                                Login
                            </a>
                        </li>
        
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('auth.signup') }}">
                                Sign up
                            </a>
                        </li>
        
                        {% endif %}
        
                        {% if current_user.is_authenticated %}
        
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('auth.logout') }}">
                                Logout
                            </a>
                        </li>
        
                        {% endif %}
        
                    </ul>
        
                </div>
            </div>
        </nav>
      
      <!--{% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert alert-danger" role="alert">
                  {{ messages[0] }}. Go to <a href="{{ url_for('auth.login') }}">login page</a>.
            </div>
            {% endif %}
      {% endwith %}-->
    <div class="container">
        <!-- Content here -->
        {% block content %}{% endblock %}     
    </div>
</body>
</html>
