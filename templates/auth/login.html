{% extends "base.html" %}

{% block title %}Matchday - Login{% endblock %}

{% block content %}

<div class="auth-page d-flex align-items-center justify-content-center py-5">

    <div class="auth-wrapper">

        <!-- Brand -->
        <div class="text-center mb-4">
            <div class="auth-brand-icon mb-2">
                ⚽
            </div>

            <h1 class="fw-bold text-primary mb-1">
                Matchday
            </h1>

            <p class="text-secondary mb-0">
                Football results
            </p>
        </div>

        <!-- Login -->
        <div class="auth-card">

            <div class="auth-card-header">
                <h3 class="fw-bold text-dark mb-1">
                    Login
                </h3>

                <p class="text-secondary mb-4">
                    Accedi al tuo account
                </p>
            </div>

            <div class="auth-card-body">

                <form method="POST" action="login">

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            Email
                        </label>

                        <input
                            class="form-control form-control-lg"
                            type="email"
                            name="email"
                            id="email"
                            placeholder="Inserisci la tua email"
                            autocomplete="email"
                            autofocus
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            class="form-control form-control-lg"
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Inserisci la tua password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <!-- Remember me -->
                    <div class="mb-4 form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="remember"
                            id="remember-check"
                        >

                        <label
                            class="form-check-label text-secondary"
                            for="remember-check"
                        >
                            Ricordami
                        </label>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn btn-primary btn-lg auth-button fw-semibold"
                        >
                            Accedi
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-3">
            <small class="text-secondary">
                Matchday · Football results
            </small>
        </div>

    </div>

</div>

{% endblock %}
